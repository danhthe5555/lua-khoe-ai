name: Lúa Khỏe AI V1.6 checks
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Load source bundle
        run: |
          if test -f lua-khoe-ai-v16-source.zip; then
            unzip -q lua-khoe-ai-v16-source.zip
          fi
      - name: Build and start isolated stack
        run: |
          mkdir -p .local/ci/fixtures .local/ci/output
          {
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'TEST_ADMIN_EMAIL=ci@example.invalid\n'
            printf 'TEST_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'TEST_IMAGE_DIRECTORY=%s/.local/ci/fixtures\n' "$PWD"
            printf 'TEST_IMAGE_NAME=unused.png\n'
            printf 'ACCEPTANCE_OUTPUT=%s/.local/ci/output\n' "$PWD"
          } > .local/ci/test.env
          docker compose --env-file .local/ci/test.env -f docker-compose.test.yml up -d --build --wait --wait-timeout 240 web mailpit
      - name: Run API tests
        run: docker compose --env-file .local/ci/test.env -f docker-compose.test.yml run --rm --no-deps -T --entrypoint python api -m pytest tests/test_security.py -v
      - name: Verify readiness through frontend proxy
        run: |
          docker compose --env-file .local/ci/test.env -f docker-compose.test.yml exec -T web wget -qO- http://127.0.0.1/health/ready
      - name: Show container state on failure
        if: failure()
        run: |
          if test -f .local/ci/test.env; then
            docker compose --env-file .local/ci/test.env -f docker-compose.test.yml ps -a
          fi
